<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GA STOCK MANAGEMENT</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f5f5f5;
margin:0;
}

header{
background:#c00000;
color:white;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
}

.container{
padding:20px;
}

.card{
background:white;
padding:20px;
margin-bottom:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h2{
color:#c00000;
margin-top:0;
}

input,select{
width:100%;
padding:10px;
margin-top:5px;
margin-bottom:10px;
}

button{
background:#c00000;
color:white;
border:none;
padding:10px;
cursor:pointer;
border-radius:5px;
}

button:hover{
background:#900000;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#c00000;
color:white;
padding:10px;
}

td{
border:1px solid #ddd;
padding:8px;
text-align:center;
}

#loginPage{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#c00000;
}

.login-box{
background:white;
padding:30px;
border-radius:10px;
width:350px;
text-align:center;
}

.stockLow{
background:#ffe5e5;
color:red;
font-weight:bold;
}

</style>
</head>

<body>

<div id="loginPage">

<div class="login-box">

<h2>GENERAL AFFAIRS STOCK</h2>

<input type="text"
id="username"
placeholder="Identifiant">

<input type="password"
id="password"
placeholder="Mot de passe">

<button onclick="login()">
Connexion
</button>

<br><br>

<b>Utilisateurs autorisés</b>

<p>
Idder<br>
med frakech<br>
chlih<br>
med belfqih
</p>

</div>

</div>

<div id="app" style="display:none;">

<header>

<h1>Gestion Stock General Affairs</h1>

<div id="userConnected"></div>

</header>

<div class="container">

<div class="card">

<h2>Entrée Stock</h2>

<label>Article</label>

<select id="article" onchange="controlTaille()">
<option>Blouse</option>
<option>Badge</option>
<option>Casier</option>
<option>Micro-onde</option>
<option>Autres</option>
</select>

<div id="tailleDiv">

<label>Taille</label>

<select id="taille">

<option>XS</option>
<option>S</option>
<option>M</option>
<option>L</option>
<option>XL</option>
<option>XXL</option>
<option>3XL</option>
<option>4XL</option>
<option>5XL</option>

</select>

</div>

<label>Quantité</label>
<input type="number" id="qte">

<label>Responsable</label>
<input type="text" id="responsable">

<button onclick="ajouterStock()">
Ajouter
</button>

</div>

<div class="card">

<h2>Sortie Stock</h2>

<label>Article</label>
<select id="sortieArticle"></select>

<label>Quantité</label>
<input type="number" id="sortieQte">

<label>Responsable</label>
<input type="text" id="sortieResp">

<label>Motif</label>

<select id="motif">
<option>Distribution officielle</option>
<option>Change</option>
<option>Perte</option>
<option>Endommagement</option>
</select>

<button onclick="sortieStock()">
Valider Sortie
</button>

</div>

<div class="card">

<h2>Stock Disponible</h2>

<table>

<thead>

<tr>
<th>Article</th>
<th>Taille</th>
<th>Entrées</th>
<th>Sorties</th>
<th>Stock</th>
</tr>

</thead>

<tbody id="tableStock"></tbody>

</table>

</div>

<div class="card">

<h2>Historique</h2>

<button onclick="viderHistorique()">
Supprimer tout l'historique
</button>

<br><br>

<table>

<thead>

<tr>
<th>Date Heure</th>
<th>Type</th>
<th>Article</th>
<th>Taille</th>
<th>Qté</th>
<th>Responsable</th>
<th>Motif</th>
<th>Action</th>
</tr>

</thead>

<tbody id="historique"></tbody>

</table>

</div>

</div>

</div>

<script>

const utilisateurs = {
"idder":"GA2026",
"med frakech":"GA2026",
"chlih":"GA2026",
"med belfqih":"GA2026"
};

function login(){

let user =
document.getElementById("username").value.toLowerCase();

let pass =
document.getElementById("password").value;

if(utilisateurs[user] &&
utilisateurs[user]===pass){

document.getElementById("loginPage").style.display="none";
document.getElementById("app").style.display="block";

document.getElementById("userConnected").innerHTML=
"Connecté : "+user;

}
else{

alert("Accès refusé");

}

}

let stock =
JSON.parse(localStorage.getItem("stockGA")) || [];

let historique =
JSON.parse(localStorage.getItem("historiqueGA")) || [];

function save(){

localStorage.setItem(
"stockGA",
JSON.stringify(stock)
);

localStorage.setItem(
"historiqueGA",
JSON.stringify(historique)
);

}

function controlTaille(){

let article =
document.getElementById("article").value;

document.getElementById("tailleDiv")
.style.display =
(article==="Blouse")
? "block"
: "none";

}

function ajouterStock(){

let article =
document.getElementById("article").value;

let taille =
article==="Blouse"
?
document.getElementById("taille").value
:
"-";

let qte =
parseInt(document.getElementById("qte").value);

let resp =
document.getElementById("responsable").value;

if(!qte || qte<=0){

alert("Quantité invalide");
return;

}

let idx = stock.findIndex(
x=>x.article===article &&
x.taille===taille
);

if(idx>=0){

stock[idx].entree += qte;

}else{

stock.push({
article,
taille,
entree:qte,
sortie:0
});

}

historique.unshift({

date:new Date().toLocaleString(),

type:"ENTREE",

article,

taille,

qte,

responsable:resp,

motif:"-"

});

save();
refresh();

}

function sortieStock(){

let valeur =
document.getElementById("sortieArticle").value;

let idx =
stock.findIndex(
x=>x.article+"|"+x.taille===valeur
);

if(idx<0) return;

let qte =
parseInt(
document.getElementById("sortieQte").value
);

let disponible =
stock[idx].entree-stock[idx].sortie;

if(qte>disponible){

alert("Stock insuffisant");
return;

}

stock[idx].sortie += qte;

historique.unshift({

date:new Date().toLocaleString(),

type:"SORTIE",

article:stock[idx].article,

taille:stock[idx].taille,

qte:qte,

responsable:
document.getElementById("sortieResp").value,

motif:
document.getElementById("motif").value

});

save();
refresh();

}

function supprimerHistorique(index){

if(confirm("Supprimer ce mouvement ?")){

historique.splice(index,1);

save();

refresh();

}

}

function viderHistorique(){

if(confirm("Supprimer tout l'historique ?")){

historique=[];

save();

refresh();

}

}

function refresh(){

let stockHtml="";
let options="";

stock.forEach(item=>{

let restant =
item.entree-item.sortie;

stockHtml += `

<tr class="${restant<5?'stockLow':''}">

<td>${item.article}</td>
<td>${item.taille}</td>
<td>${item.entree}</td>
<td>${item.sortie}</td>
<td>${restant}</td>

</tr>

`;

options += `

<option value="${item.article}|${item.taille}">
${item.article} (${item.taille})
</option>

`;

});

document.getElementById("tableStock").innerHTML=stockHtml;

document.getElementById("sortieArticle").innerHTML=options;

let histHtml="";

historique.forEach((h,index)=>{

histHtml += `

<tr>

<td>${h.date}</td>
<td>${h.type}</td>
<td>${h.article}</td>
<td>${h.taille}</td>
<td>${h.qte}</td>
<td>${h.responsable}</td>
<td>${h.motif}</td>

<td>

<button
onclick="supprimerHistorique(${index})">
Supprimer
</button>

</td>

</tr>

`;

});

document.getElementById("historique").innerHTML=histHtml;

}

refresh();
controlTaille();

</script>

</body>
</html>
